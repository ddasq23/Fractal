# Kirby and the Rainbow Curse (USA)

# Fractal (Android): the device's own Vulkan driver, the fastest on both test devices (Retroid Pocket 5 60.0 fps vs 55.5
# on Turnip MrPurple T19; POCO X6 Pro Mali 45.5 vs 31.4 on PanVK).
[AndroidDriver]
mode = 1

[Graphics]
# Mesa Turnip in system memory mode (TU_DEBUG=sysmem, the Fractal default) rebooted the Retroid Pocket 5 a few seconds
# into Green Valley 1-1 in 4 of 5 runs (T19 and T30, nothing in the kernel log). Tiled rendering ran 3 of 3 at the same
# speed. Kept here for profiles copied from this one that switch to Turnip.
turnipSysmem = false
