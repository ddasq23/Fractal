# Yoshi's Woolly World (EUR)

# Fractal (Android): the device's own Vulkan driver. Turnip MrPurple T30 hung the GPU of the Retroid Pocket 5 in World 1-1
# (kgsl "GPU hang detected", then VK_ERROR_DEVICE_LOST) in 4 of 5 runs, with streamout as storage buffer writes and as
# transform feedback alike. The system driver is the fastest there anyway (RP5 46.6 fps vs 41.9 on T19), and on Mali the
# vendor driver beats PanVK (POCO X6 Pro 56.8 vs 32.9). A game profile of your own can still pick another driver.
[AndroidDriver]
mode = 1
