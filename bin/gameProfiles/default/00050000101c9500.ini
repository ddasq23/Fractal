# TLoZ: Breath of the Wild (EUR)

[Graphics]
disableGPUFence = false
accurateShaderMul = true
# GX2DrawDone without waiting for readbacks: +17 % FPS on the Retroid Pocket 5 (Fractal)
fullSyncAtGX2DrawDone = false
# Mesa Turnip: tiled (GMEM) rendering hangs the GPU at boot on Adreno 650 (Turnip 26.0 R8); system memory runs at 16 fps (Fractal)
turnipSysmem = true
