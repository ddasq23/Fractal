# Super Smash Bros for Wii U (USA)

[CPU]
cpuMode = Singlecore-Recompiler

[Graphics]
streamoutBufferCacheSize = 48

# Fractal (Android): the device's own Vulkan driver. With Turnip (MrPurple T19 and T30) the Retroid Pocket 5 rebooted at
# the end of 4 of 4 matches (no kernel message), and the system driver is also faster here: RP5 54 fps vs 40 on T19,
# POCO X6 Pro 55 fps vs 37 on PanVK. A game profile of your own can still pick another driver.
[AndroidDriver]
mode = 1
