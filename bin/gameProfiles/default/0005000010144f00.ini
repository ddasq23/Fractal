# Super Smash Bros for Wii U (USA)

[CPU]
cpuMode = Singlecore-Recompiler

[Graphics]
streamoutBufferCacheSize = 48

# Fractal (Android): the device's own Vulkan driver. With Turnip (MrPurple T19 and T30) the Retroid Pocket 5 rebooted at
# the end of 4 of 4 matches (no kernel message) and never with the system driver, which is as fast there (RP5 about
# 42 fps both ways on Mario Galaxy) and faster on Mali (POCO X6 Pro 55 fps vs 37 on PanVK). A game profile of your own
# can still pick another driver.
[AndroidDriver]
mode = 1
